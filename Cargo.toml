[package]
name = "stickmap"
version = "0.1.0"
edition = "2021"
description = "Bridge physical mouse movement to a virtual Xbox 360 right-stick via ViGEm."

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
env_logger = "0.11"
libloading = "0.8"
log = "0.4"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 2
lto = true